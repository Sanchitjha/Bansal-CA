services:
  - type: web
    name: bansal-ca-backend
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Paste your MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false          # Set to your Vercel URL, e.g. https://bansal-ca.vercel.app
      - key: JWT_SECRET
        generateValue: true  # Render will generate a strong random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: SEED_ADMIN_EMAIL
        sync: false          # e.g. amit.bansal@aa.com
      - key: SEED_ADMIN_PASSWORD
        sync: false          # Set a strong password before first deploy; change after login
      - key: SEED_ADMIN_FIRST_NAME
        value: Amit
      - key: SEED_ADMIN_LAST_NAME
        value: Bansal
